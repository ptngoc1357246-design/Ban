<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tặng Ban✨</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700&family=Dancing+Script:wght@700&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: linear-gradient(135deg, #fff0f5 0%, #ffe0ec 50%, #ffd6e7 100%);
    font-family: 'Quicksand', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #590d22;
    padding: 20px;
  }

  /* Canvas pháo hoa */
  #fireworks {
    position: fixed; inset: 0; pointer-events: none; z-index: 5;
  }

  /* Màn hình mở đầu tinh nghịch */
  #overlay {
    position: fixed; inset: 0; background: rgba(255, 240, 245, 0.98);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 100; text-align: center; transition: opacity 0.8s; padding: 20px;
  }
  .ask-box {
    background: white; padding: 32px 24px; border-radius: 24px;
    box-shadow: 0 15px 35px rgba(255, 77, 109, 0.2);
    max-width: 360px; width: 90vw; border: 3px dashed #ff8fa3;
  }
  .ask-box h2 { font-size: 22px; color: #c9184a; margin-bottom: 10px; }
  .ask-box p { font-size: 15px; color: #800f2f; margin-bottom: 25px; }
  .btn-group { display: flex; gap: 16px; justify-content: center; align-items: center; position: relative; min-height: 50px; }
  .btn-yes {
    background: #ff4d6d; color: white; border: none; padding: 12px 28px;
    font-size: 17px; border-radius: 50px; font-weight: bold; cursor: pointer;
    box-shadow: 0 6px 15px rgba(255, 77, 109, 0.4); transition: transform 0.2s;
  }
  .btn-yes:hover { transform: scale(1.1); }
  .btn-no {
    background: #e9ecef; color: #495057; border: none; padding: 12px 24px;
    font-size: 16px; border-radius: 50px; font-weight: bold; cursor: pointer;
    transition: all 0.2s ease;
  }

  /* Khung ảnh Polaroid tinh nghịch */
  .polaroid {
    background: white; padding: 14px 14px 36px 14px; border-radius: 12px;
    box-shadow: 0 15px 35px rgba(89, 13, 34, 0.16);
    max-width: 330px; width: 88vw; text-align: center;
    transform: rotate(-2deg); transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    z-index: 10; position: relative;
  }
  .polaroid::before {
    content: "📌"; position: absolute; top: -14px; left: 50%; transform: translateX(-50%); font-size: 24px;
  }
  .polaroid img {
    width: 100%; height: 330px; object-fit: cover; border-radius: 8px;
    transition: opacity 0.4s ease, transform 0.4s ease;
  }
  .caption {
    font-family: 'Dancing Script', cursive; font-size: 24px;
    margin-top: 12px; color: #ff4d6d;
  }

  /* Hộp lời kết tạm biệt */
  .farewell-box {
    max-width: 420px; width: 92vw; background: rgba(255, 255, 255, 0.9);
    backdrop-filter: blur(8px); padding: 24px; border-radius: 20px;
    margin-top: 24px; box-shadow: 0 12px 30px rgba(201, 24, 74, 0.12);
    text-align: center; line-height: 1.7; font-size: 16px; z-index: 10;
    opacity: 0; transform: translateY(25px) scale(0.95); transition: all 0.9s ease;
    border: 2px solid #ffb3c1;
  }
  .farewell-box.show { opacity: 1; transform: translateY(0) scale(1); }
  .signature { font-family: 'Dancing Script', cursive; font-size: 28px; color: #ff4d6d; margin-top: 12px; }

  .heart {
    position: fixed; bottom: -20px; animation: floatUp linear forwards; z-index: 2; pointer-events: none;
  }
  @keyframes floatUp {
    to { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
  }
</style>
</head>
<body>

<canvas id="fireworks"></canvas>

<div id="overlay">
  <div class="ask-box">
    <h2>🎁 Ting ting! Có quà nè!</h2>
    <p>Bạn có muốn nhận món quà đặc biệt này trước khi sang Hàn không?</p>
    <div class="btn-group">
      <button class="btn-yes" onclick="startShow()">Có 😍✨</button>
      <button class="btn-no" id="noBtn" onmouseover="dodgeBtn()" onclick="dodgeBtn()">Kó 😒</button>
    </div>
  </div>
</div>

<audio id="bgMusic" src="nhac.mp3"></audio>

<div class="polaroid" id="card">
  <img id="slideImg" src="anh_web/pic_01.jpg" alt="Kỷ niệm">
  <div class="caption" id="funCaption">Ổ Đóm mãi đỉnh 🔥</div>
</div>

<div class="farewell-box" id="farewell">
  <div id="typedText"></div>
  <div class="signature">— Nanh Ngọc Vinh Ban —</div>
</div>

<script>
  const photos = ["anh_web/pic_01.jpg", "anh_web/pic_02.jpg", "anh_web/pic_03.jpg", "anh_web/pic_04.jpg", "anh_web/pic_05.jpg", "anh_web/pic_06.jpg", "anh_web/pic_07.jpg", "anh_web/pic_08.jpg"];
  const message = "C\u1ea3m \u01a1n v\u00ec t\u1ea5t c\u1ea3 nh\u1eefng k\u1ef7 ni\u1ec7m ! \ud83c\udf86";
  const funCaptions = [
    "Ổ Đóm mãi đỉnh 🔥",
    "Sang Hàn nhớ gửi quà về nhíe 📦",
    "Tôi quý bạn lắm: 😤",
    "Giàu đừng quên tui 😎",
    "Annyeonghaseyo Đăng Ban ✨",
    "Hí lo Ban nhaaa 🤙"
  ];
  const noTexts = ["Kó 😒", "Ơ kìa?? 🤨", "Bấm nhầm rồi! 😝", "Không thoát được đâu 😂", "Bấm nút Có đi mà 🥺"];
  let current = 0;
  let noCount = 0;
  let fireworksActive = false;

  // Nút Kó chạy trốn tinh nghịch
  function dodgeBtn() {
    const btn = document.getElementById('noBtn');
    noCount++;
    btn.innerText = noTexts[noCount % noTexts.length];
    const x = (Math.random() * 200 - 100);
    const y = (Math.random() * 160 - 80);
    btn.style.transform = `translate(${x}px, ${y}px) rotate(${Math.random()*20 - 10}deg)`;
  }

  function startShow() {
    document.getElementById('overlay').style.opacity = '0';
    setTimeout(() => document.getElementById('overlay').style.display = 'none', 800);
    
    // Phát nhạc từ đúng giây thứ 41
    const music = document.getElementById('bgMusic');
    music.currentTime = 41;
    music.play().catch(() => {});
    music.addEventListener('ended', () => {
      music.currentTime = 41;
      music.play();
    });
    
    setInterval(createHeart, 380);
    setInterval(nextPhoto, 2800);
    
    // Hiện lời kết và bắn pháo hoa rực rỡ
    setTimeout(() => {
      showFarewell();
      fireworksActive = true;
      launchFirework();
      setInterval(launchFirework, 1100);
    }, 2500);
  }

  function nextPhoto() {
    if (photos.length <= 1) return;
    const img = document.getElementById('slideImg');
    const card = document.getElementById('card');
    img.style.opacity = 0;
    img.style.transform = 'scale(0.92)';
    setTimeout(() => {
      current = (current + 1) % photos.length;
      img.src = photos[current];
      document.getElementById('funCaption').innerText = funCaptions[current % funCaptions.length];
      card.style.transform = `rotate(${(Math.random() * 8 - 4).toFixed(1)}deg)`;
      img.style.opacity = 1;
      img.style.transform = 'scale(1)';
    }, 400);
  }

  function createHeart() {
    const heart = document.createElement('div');
    heart.className = 'heart';
    heart.innerText = ['❤️', '💖', '🌸', '✨', '🎈'][Math.floor(Math.random() * 5)];
    heart.style.left = Math.random() * 100 + 'vw';
    heart.style.fontSize = (Math.random() * 16 + 15) + 'px';
    heart.style.animationDuration = (Math.random() * 3 + 3.5) + 's';
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 6500);
  }

  function showFarewell() {
    const box = document.getElementById('farewell');
    box.classList.add('show');
    let i = 0;
    const target = document.getElementById('typedText');
    function typeWriter() {
      if (i < message.length) {
        target.innerHTML += message.charAt(i) === '\n' ? '<br>' : message.charAt(i);
        i++;
        setTimeout(typeWriter, 40);
      }
    }
    typeWriter();
  }

  // Hiệu ứng pháo hoa rực rỡ
  const canvas = document.getElementById('fireworks');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  window.addEventListener('resize', () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  });

  let particles = [];
  function launchFirework() {
    if (!fireworksActive) return;
    const x = Math.random() * canvas.width * 0.8 + canvas.width * 0.1;
    const y = Math.random() * canvas.height * 0.45 + canvas.height * 0.1;
    const colors = ['#ff4d6d', '#ffbe0b', '#fb5607', '#ff006e', '#8338ec', '#3a86ff'];
    const color = colors[Math.floor(Math.random() * colors.length)];
    for (let i = 0; i < 45; i++) {
      const angle = (Math.PI * 2 / 45) * i;
      const speed = Math.random() * 4 + 2;
      particles.push({
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        alpha: 1,
        color
      });
    }
  }

  function animateFireworks() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach((p, idx) => {
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.05;
      p.alpha -= 0.015;
      ctx.globalAlpha = Math.max(p.alpha, 0);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
      ctx.fill();
      if (p.alpha <= 0) particles.splice(idx, 1);
    });
    requestAnimationFrame(animateFireworks);
  }
  animateFireworks();
</script>
</body>
</html>
